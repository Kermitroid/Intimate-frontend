name: Ping Search Engines After Deployment

on:
  push:
    branches: [main]

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Google & Bing of updated sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://intimate-videos.com/sitemap.xml"
          curl -s "https://www.bing.com/ping?sitemap=https://intimate-videos.com/sitemap.xml"
